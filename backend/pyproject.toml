[project]
name = "data-comparator"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B027", "B905", "UP042"]  # B008: FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"app/engine/insights.py" = ["E501"]  # user-facing prose

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
